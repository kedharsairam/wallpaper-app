name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallkraft

    steps:
      - name: Checkout wallkraft
        uses: actions/checkout@v4
        with:
          path: wallkraft

      - name: Checkout shared
        uses: actions/checkout@v4
        with:
          repository: kedharsairam/shared
          path: shared
          token: ${{ secrets.PAT_SHARED }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.x'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
