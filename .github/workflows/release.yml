name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.x'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK (signed or unsigned)
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs with version tag
        id: rename
        run: |
          # Strip "v" prefix from tag: "v1.0.0" → "1.0.0"
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            name=$(basename "$apk")
            # Extract ABI from filename: app-arm64-v8a-release.apk → arm64-v8a
            abi=$(echo "$name" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            if [ "$abi" = "$name" ]; then
              newname="WallKraft-${VERSION}-universal.apk"
            else
              newname="WallKraft-${VERSION}-${abi}.apk"
            fi
            mv "$apk" "$(dirname "$apk")/$newname"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: WallKraft ${{ github.ref_name }}
          body: |
            ## WallKraft ${{ github.ref_name }}

            Download the APK for your device:

            | Architecture | File |
            |-------------|------|
            | **arm64-v8a** (modern phones) | `WallKraft-${{ steps.rename.outputs.version }}-arm64-v8a.apk` |
            | **armeabi-v7a** (older 32-bit devices) | `WallKraft-${{ steps.rename.outputs.version }}-armeabi-v7a.apk` |
            | **x86_64** (emulators / Chromebooks) | `WallKraft-${{ steps.rename.outputs.version }}-x86_64.apk` |

            ### Install
            1. Download the APK for your device
            2. Open the file on your Android device
            3. Allow "Install from unknown sources" if prompted

            ### Verify
            - Analyze: ✅ passes
            - Tests: ✅ passes
          files: |
            build/app/outputs/flutter-apk/WallKraft-*.apk
