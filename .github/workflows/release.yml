name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: wallkraft

    steps:
      - name: Checkout wallkraft
        uses: actions/checkout@v4
        with:
          path: wallkraft

      - name: Checkout shared
        uses: actions/checkout@v4
        with:
          repository: kedharsairam/shared
          path: shared
          token: ${{ secrets.PAT_SHARED }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.x'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK (unsigned)
        run: flutter build apk --release

      - name: Rename APK with version tag
        id: rename
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/WallKraft-${VERSION}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: WallKraft ${{ github.ref_name }}
          body: |
            ## WallKraft ${{ github.ref_name }}

            ### Install
            1. Download `WallKraft-${{ steps.rename.outputs.version }}.apk`
            2. Open the file on your Android device
            3. Allow "Install from unknown sources" if prompted

            ### Verify
            - Analyze: ✅ passes
            - Tests: ✅ passes
          files: |
            wallkraft/build/app/outputs/flutter-apk/WallKraft-*.apk
