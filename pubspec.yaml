name: wallkraft
description: "WallKraft — Browse, download, and favorite high-resolution wallpapers."
publish_to: 'none'

version: 1.1.3+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.0
  cached_network_image: ^3.4.0
  path_provider: ^2.1.0
  path: ^1.9.0
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.3.0
  share_plus: 13.3.0
  flutter_staggered_grid_view: ^0.7.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.2.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  package_info_plus: 10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0
  flutter_lints: ^6.0.0
  image: ^4.9.1
  mocktail: ^1.0.5

dependency_overrides:
  # jni 1.0.1 has a build.gradle bug: applies kotlin-android only for AGP < 9,
  # but runs `kotlin { compilerOptions { ... } }` unconditionally, which fails
  # with AGP 9. Pin to 1.0.0 which doesn't use Kotlin Gradle plugin at all.
  jni: 1.0.0

